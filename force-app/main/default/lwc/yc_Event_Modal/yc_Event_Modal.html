<template>
    <div class="event-list-container">
        <!-- Inactivity Modal -->
        <template if:true={showInactivityModal}>
            <div class="modal-backdrop">
                <div class="modal-container">
                    <!-- Modal Header -->
                    <div class="modal-header">
                        <h2 class="modal-title">Don't Miss Out!</h2>
                        <button class="modal-close-button" onclick={closeInactivityModal} aria-label="Close modal">
                            <lightning-icon icon-name="utility:close" size="small"></lightning-icon>
                        </button>
                    </div>
                    
                    <!-- Modal Content - Featured Event Card -->
                    <div class="modal-content">
                        <p class="modal-subtitle">Join our next upcoming event:</p>
                        
                        <template if:true={featuredEvent}>
                            <div class="featured-event-card">
                                <div class="event-card-content">
                                    <div class="event-main-section">
                                        <div class="event-content-row">
                                            <!-- Date Section -->
                                            <div class="event-date-section">
                                                <div class="event-date-container">
                                                    <span class="event-day">{featuredEvent.day}</span>
                                                    <div class="event-month-year">{featuredEvent.monthYear}</div>
                                                </div>
                                            </div>
                                            
                                            <!-- Content Section -->
                                            <div class="event-content-section">
                                                <h2 class="event-title">{featuredEvent.title}</h2>
                                                
                                                <div class="event-meta">
                                                    <div class="event-time-container">
                                                        <lightning-icon 
                                                            icon-name="utility:clock" 
                                                            size="small" 
                                                            class="event-icon">
                                                        </lightning-icon>
                                                        <span class="event-time">{featuredEvent.time}</span>
                                                    </div>
                                                    <lightning-icon 
                                                        icon-name="utility:world" 
                                                        size="small" 
                                                        class="event-icon">
                                                    </lightning-icon>
                                                </div>
                                                
                                                <!-- Register Button - Mobile/Tablet -->
                                                <div class="register-mobile">
                                                    <div 
                                                        class="custom-register-button"
                                                        onclick={handleModalRegister}
                                                        role="button"
                                                        tabindex="0">
                                                        Register Now
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                        
                                        <!-- Register Button - Desktop -->
                                        <div class="register-desktop">
                                            <div 
                                                class="custom-register-button"
                                                onclick={handleModalRegister}
                                                role="button"
                                                tabindex="0">
                                                Register Now
                                            </div>
                                        </div>
                                    </div>
                                    
                                    <!-- Divider Line -->
                                    <hr class="event-divider">
                                    
                                    <!-- Description -->
                                    <div class="event-description-section">
                                        <p class="event-description">{featuredEvent.description}</p>
                                    </div>
                                </div>
                            </div>
                        </template>
                    </div>
                </div>
            </div>
        </template>

        <!-- Lead Registration Modal -->
        <template if:true={showLeadRegistrationModal}>
            <div class="modal-backdrop">
                <div class="modal-container lead-registration-container">
                    <!-- Modal Header -->
                    <div class="modal-header">
                        <h2 class="modal-title">Register for Event</h2>
                        <button class="modal-close-button" onclick={closeLeadRegistrationModal} aria-label="Close modal">
                            <lightning-icon icon-name="utility:close" size="small"></lightning-icon>
                        </button>
                    </div>
                    
                    <!-- Lead Registration Form -->
                    <div class="modal-content lead-form-content">
                        <p class="lead-form-intro">Please provide the following information below to register for this event.</p>
                        <p class="required-indicator">All fields are required except SMS opt-in</p>
                        
                        <!-- Error Message Display -->
                        <template if:true={formErrorMessage}>
                            <div class="slds-notify slds-notify_alert slds-alert_error slds-m-bottom_medium" role="alert">
                                <span class="slds-assistive-text">error</span>
                                <h2 class="slds-text-heading_small">
                                    <lightning-icon icon-name="utility:error" size="small" variant="inverse" class="slds-m-right_x-small"></lightning-icon>
                                    {formErrorMessage}
                                </h2>
                            </div>
                        </template>
                        
                        <div class="lead-form">
                            <!-- First Name -->
                            <div class="form-field">
                                <lightning-input
                                    type="text"
                                    label="First Name"
                                    name="firstName"
                                    value={leadFormData.firstName}
                                    onchange={handleLeadFormChange}
                                    variant="standard">
                                </lightning-input>
                            </div>
                            
                            <!-- Last Name -->
                            <div class="form-field">
                                <lightning-input
                                    type="text"
                                    label="Last Name"
                                    name="lastName"
                                    value={leadFormData.lastName}
                                    onchange={handleLeadFormChange}
                                    variant="standard">
                                </lightning-input>
                            </div>
                            
                            <!-- Email -->
                            <div class="form-field">
                                <lightning-input
                                    type="email"
                                    label="Email address"
                                    name="email"
                                    value={leadFormData.email}
                                    onchange={handleLeadFormChange}
                                    variant="standard">
                                </lightning-input>
                            </div>
                            
                            <!-- Phone -->
                            <div class="form-field">
                                <lightning-input
                                    type="tel"
                                    label="Phone number"
                                    name="phone"
                                    value={leadFormData.phone}
                                    onchange={handleLeadFormChange}
                                    variant="standard">
                                </lightning-input>
                            </div>
                            
                            <!-- State -->
                            <div class="form-field">
                                <lightning-combobox
                                    label="State"
                                    name="state"
                                    value={leadFormData.state}
                                    options={stateOptions}
                                    onchange={handleLeadFormChange}
                                    variant="standard">
                                </lightning-combobox>
                            </div>
                            
                            <!-- ZIP Code -->
                            <div class="form-field">
                                <lightning-input
                                    type="text"
                                    label="ZIP Code"
                                    name="zipCode"
                                    value={leadFormData.zipCode}
                                    onchange={handleLeadFormChange}
                                    pattern="[0-9]{5}"
                                    message-when-pattern-mismatch="Please enter a valid 5-digit ZIP code"
                                    variant="standard">
                                </lightning-input>
                            </div>
                            
                            <!-- SMS Opt-in Checkbox (Optional) -->
                            <div class="form-field checkbox-field">
                                <lightning-input
                                    type="checkbox"
                                    name="smsOptIn"
                                    label="Text me about webinar reminders, enrollment updates, and other offers. Text message and data rates may apply. Message frequency varies. Reply STOP to opt-out. (Optional)"
                                    value={leadFormData.smsOptIn}
                                    onchange={handleLeadFormChange}
                                    variant="standard" 
                                    checked={leadFormData.smsOptIn}>
                                </lightning-input>
                            </div>
                            
                            <!-- Submit Button -->
                            <div class="form-actions">
                                <lightning-button
                                    variant="brand"
                                    label="Submit"
                                    onclick={handleLeadFormSubmit}
                                    disabled={isSubmittingLead}
                                    class="submit-button">
                                </lightning-button>
                            </div>
                            
                            <!-- Terms and Privacy -->
                            <div class="form-disclaimer">
                                <p>By submitting this form, you consent to receive emails, autodialed marketing calls, and text messages 
                                from Connections Academy and other educational opportunities at the email address and phone number 
                                you provided and agree to our <a href="#" onclick={handleTermsClick}>Terms of Use</a>, 
                                <a href="#" onclick={handlePrivacyClick}>Privacy Policy</a> and acknowledge that you are at least 18 
                                years of age. You may opt out of receiving these communications any time. If you do not consent, 
                                <a href="#" onclick={handleContactClick}>contact us</a> for more details.</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </template>
    </div>
</template>
