<template>
    <div class="event-list-container">
        <!-- Loading State -->
        <template if:true={isLoading}>
            <div class="slds-text-align_center slds-p-around_medium">
                <lightning-spinner alternative-text="Loading events..." size="medium"></lightning-spinner>
                <p class="slds-m-top_small">Loading upcoming events...</p>
            </div>
        </template>

        <!-- Error State -->
        <template if:true={hasError}>
            <div class="slds-notify slds-notify_alert slds-alert_error slds-m-bottom_medium">
                <span class="slds-assistive-text">Error</span>
                <h2>Unable to load events</h2>
                <p>{errorMessage}</p>
            </div>
        </template>

        <!-- No Events State -->
        <template if:false={hasEvents}>
            <template if:false={isLoading}>
                <template if:false={hasError}>
                    <div class="slds-text-align_center slds-p-around_large">
                        <lightning-icon icon-name="utility:event" size="large" class="slds-m-bottom_small"></lightning-icon>
                        <h3 class="slds-text-heading_medium slds-m-bottom_small">No Upcoming Events</h3>
                        <p class="slds-text-body_regular">There are currently no events scheduled. Please check back later.</p>
                    </div>
                </template>
            </template>
        </template>

        <!-- Events List -->
        <template if:true={hasEvents}>
            <template for:each={events} for:item="event">
                <div key={event.id} class="event-card">
                    <div class="event-card-content">
                        <div class="event-main-section">
                            <div class="event-content-row">
                                <!-- Date Section -->
                                <div class="event-date-section">
                                    <div class="event-date-container">
                                        <span class="event-day">{event.day}</span>
                                        <div class="event-month-year">{event.monthYear}</div>
                                    </div>
                                </div>
                                
                                <!-- Content Section -->
                                <div class="event-content-section">
                                    <h2 class="event-title">{event.title}</h2>
                                    
                                    <div class="event-meta">
                                        <div class="event-time-container">
                                            <lightning-icon 
                                                icon-name="utility:clock" 
                                                size="small" 
                                                class="event-icon">
                                            </lightning-icon>
                                            <span class="event-time">{event.time}</span>
                                        </div>
                                        <lightning-icon 
                                            icon-name="utility:world" 
                                            size="small" 
                                            class="event-icon">
                                        </lightning-icon>
                                    </div>
                                    
                                    <!-- Register Button - Mobile/Tablet -->
                                    <div class="register-mobile">
                                        <template if:false={event.isRegistering}>
                                            <div 
                                                class={event.isButtonDisabled ? 'custom-register-button custom-register-button-disabled' : 'custom-register-button'}
                                                onclick={handleRegister}
                                                data-event-id={event.id}
                                                role="button"
                                                tabindex="0">
                                                {event.buttonLabel}
                                            </div>
                                        </template>
                                        <template if:true={event.isRegistering}>
                                            <div class="register-loading-mobile">
                                                <lightning-spinner 
                                                    alternative-text="Registering..." 
                                                    size="small"
                                                    class="register-spinner">
                                                </lightning-spinner>
                                                <span class="register-loading-text">Registering...</span>
                                            </div>
                                        </template>
                                    </div>
                                </div>
                            </div>
                            
                            <!-- Register Button - Desktop -->
                            <div class="register-desktop">
                                <template if:false={event.isRegistering}>
                                    <div 
                                        class={event.isButtonDisabled ? 'custom-register-button custom-register-button-disabled' : 'custom-register-button'}
                                        onclick={handleRegister}
                                        data-event-id={event.id}
                                        role="button"
                                        tabindex="0">
                                        {event.buttonLabel}
                                    </div>
                                </template>
                                <template if:true={event.isRegistering}>
                                    <div class="register-loading-desktop">
                                        <lightning-spinner 
                                            alternative-text="Registering..." 
                                            size="small"
                                            class="register-spinner">
                                        </lightning-spinner>
                                        <span class="register-loading-text">Registering...</span>
                                    </div>
                                </template>
                            </div>
                        </div>
                        
                        <!-- Divider Line -->
                        <hr class="event-divider">
                        
                        <!-- Description -->
                        <div class="event-description-section">
                            <p class="event-description">{event.description}</p>
                        </div>
                    </div>
                </div>
            </template>
        </template>

        <!-- Inactivity Modal -->
        <template if:true={showInactivityModal}>
            <div class="modal-backdrop">
                <div class="modal-container">
                    <!-- Modal Header -->
                    <div class="modal-header">
                        <h2 class="modal-title">Don't Miss Out!</h2>
                        <button class="modal-close-button" onclick={closeInactivityModal} aria-label="Close modal">
                            <lightning-icon icon-name="utility:close" size="small"></lightning-icon>
                        </button>
                    </div>
                    
                    <!-- Modal Content - Featured Event Card -->
                    <div class="modal-content">
                        <p class="modal-subtitle">Join our next upcoming event:</p>
                        
                        <template if:true={featuredEvent}>
                            <div class="featured-event-card">
                                <div class="slds-grid slds-gutters">
                                    <!-- Date Section -->
                                    <div class="slds-col slds-size_12-of-12 slds-medium-size_3-of-12">
                                        <div class="event-date-container">
                                            <span class="event-day">{featuredEvent.day}</span>
                                            <span class="event-month-year">{featuredEvent.monthYear}</span>
                                        </div>
                                    </div>
                                    
                                    <!-- Event Details Section -->
                                    <div class="slds-col slds-size_12-of-12 slds-medium-size_7-of-12">
                                        <div class="event-details">
                                            <h3 class="slds-text-heading_medium slds-m-bottom_x-small event-title">
                                                {featuredEvent.title}
                                            </h3>
                                            
                                            <div class="event-meta slds-grid slds-grid_align-start">
                                                <div class="slds-col slds-grid slds-grid_vertical-align-center slds-m-right_small">
                                                    <lightning-icon 
                                                        icon-name="utility:clock" 
                                                        size="x-small" 
                                                        class="clock-icon">
                                                    </lightning-icon>
                                                    <span class="slds-m-left_xx-small event-time">{featuredEvent.time}</span>
                                                </div>
                                                
                                                <div class="slds-col slds-grid slds-grid_vertical-align-center">
                                                    <lightning-icon 
                                                        icon-name="utility:world" 
                                                        size="x-small" 
                                                        class="world-icon">
                                                    </lightning-icon>
                                                    <span class="slds-m-left_xx-small event-type">{featuredEvent.type}</span>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                    
                                    <!-- Register Button Section -->
                                    <div class="slds-col slds-size_12-of-12 slds-medium-size_2-of-12">
                                        <div class="register-container">
                                            <div 
                                                class="custom-register-button modal-register-button" 
                                                onclick={handleModalRegister}
                                                role="button"
                                                tabindex="0">
                                                Register Now
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                
                                <!-- Description Section -->
                                <div class="slds-grid">
                                    <div class="slds-col slds-size_1-of-1">
                                        <hr class="event-divider">
                                        <p class="slds-text-body_regular slds-m-top_x-small event-description">
                                            {featuredEvent.description}
                                        </p>
                                    </div>
                                </div>
                            </div>
                        </template>
                    </div>
                </div>
            </div>
        </template>
    </div>
</template>
