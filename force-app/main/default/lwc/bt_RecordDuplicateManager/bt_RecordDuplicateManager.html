<template>
    <lightning-card title="Potential Duplicates" icon-name="utility:copy_to_clipboard">
        <div class="slds-p-horizontal_medium slds-p-bottom_small header-actions">
            <div class="left">
                <template if:true={_fieldSetName}>
                    <span class="context">
                        Showing fields from field set <strong>{_fieldSetName}</strong>
                    </span>
                </template>
            </div>
            <div class="right">
                <lightning-button-icon icon-name="utility:refresh" variant="border" alternative-text="Refresh"
                                       title="Refresh" onclick={handleRefresh}
                                       disabled={isLoading}>
                </lightning-button-icon>
            </div>
        </div>

        <template if:true={isLoading}>
            <div class="slds-p-around_medium">
                <lightning-spinner size="medium" alternative-text="Loading duplicates"></lightning-spinner>
            </div>
        </template>

        <template if:true={isMerging}>
            <div class="slds-p-around_medium">
                <lightning-spinner size="medium" alternative-text="Merging contacts..."></lightning-spinner>
            </div>
        </template>

        <template if:true={hasSets}>
            <template if:false={isLoading}>
                <template if:false={isMerging}>
                    <div class="slds-p-horizontal_medium slds-p-bottom_medium">
                        <template for:each={setsWithMeta} for:item="set">
                            <article key={set.setId} class="set-card slds-m-bottom_large">
                                <header class="set-card__header slds-grid slds-grid_vertical-align-center">
                                    <div class="slds-truncate">
                                        <span class="slds-text-title_caps">Duplicate Record Set</span>
                                        <h3 class="slds-text-heading_small slds-m-top_xx-small">
                                            <lightning-formatted-text value={set.setId}></lightning-formatted-text>
                                        </h3>
                                        <div class="meta">
                                            <template if:true={set.ruleDeveloperName}>
                                                <span class="rule">Rule: <strong>{set.ruleDeveloperName}</strong></span>
                                            </template>
                                            <span class="sep">•</span>
                                            <span>{set.totalItems} records in set</span>
                                        </div>
                                    </div>
                                    <div class="set-card__actions slds-m-left_auto">
                                        <lightning-button-group>
                                            <lightning-button label="Approve (Not a duplicate)" title="Approve (delete this set)"
                                                              onclick={handleApprove}
                                                              data-set-id={set.setId} 
                                                              variant="destructive-text"
                                                              disabled={isMerging}></lightning-button>
                                            <lightning-button label="View Set" title="Open Duplicate Record Set"
                                                              onclick={handleViewSet} disabled={isMerging} 
                                                              data-set-id={set.setId}></lightning-button>
                                        </lightning-button-group>
                                    </div>
                                </header>

                                <template if:true={set.duplicateContactsWithMeta.length}>
                                    <div class="tiles">
                                        <template for:each={set.duplicateContactsWithMeta} for:item="contact">
                                            <section key={contact.contactId} class="tile">
                                                <lightning-record-view-form record-id={contact.contactId} object-api-name="Contact">
                                                    <div class="tile__header slds-p-bottom_x-small">
                                                        <lightning-output-field field-name="Name"></lightning-output-field>
                                                        <template if:true={contact.isCurrentRecord}>
                                                            <lightning-badge label="Current Record" class="slds-m-left_x-small"></lightning-badge>
                                                        </template>
                                                    </div>

                                                    <div class="tile__body">
                                                        <template if:true={fieldDescriptors}>
                                                            <template for:each={fieldDescriptors} for:item="f">
                                                                <div key={f.apiName} class="field-row">
                                                                    <lightning-output-field field-name={f.apiName}></lightning-output-field>
                                                                </div>
                                                            </template>
                                                        </template>
                                                    </div>

                                                    <div class="tile__footer">
                                                        <template if:false={contact.isCurrentRecord}>
                                                            <lightning-button label="Quick Merge" title="Quick Merge"
                                                                            onclick={handleOpenMergeModal} 
                                                                            data-contact-id={contact.contactId} 
                                                                            variant="brand" 
                                                                            class="slds-var-m-right_x-small"
                                                                            disabled={isMerging}></lightning-button>
                                                            <lightning-button-icon icon-name="utility:new_window"
                                                                                   onclick={handleOpenContact}
                                                                                   data-contact-id={contact.contactId}
                                                                                   alternative-text="Open Contact"
                                                                                   title="Open Contact"
                                                                                   disabled={isMerging}></lightning-button-icon>
                                                        </template>
                                                        <template if:true={contact.isCurrentRecord}>
                                                            <div class="slds-text-body_small slds-text-color_weak">
                                                                This is the current record being viewed
                                                            </div>
                                                        </template>
                                                    </div>
                                                </lightning-record-view-form>
                                            </section>
                                        </template>
                                    </div>
                                </template>

                                <template if:false={set.duplicateContactsWithMeta.length}>
                                    <div class="slds-p-around_medium slds-text-color_weak">
                                        No other records in this set (nothing to review).
                                    </div>
                                </template>
                            </article>
                        </template>
                    </div>
                </template>
            </template>
        </template>

        <template if:false={hasSets}>
            <template if:false={isLoading}>
                <template if:false={isMerging}>
                    <div class="slds-p-around_large empty-state">
                        <div class="slds-text-heading_small slds-m-bottom_x-small">No potential duplicates</div>
                        <div class="slds-text-color_weak">
                            We didn't find any Duplicate Record Sets that include this Contact.
                        </div>
                    </div>
                </template>
            </template>
        </template>
    </lightning-card>

    <!-- Merge Modal -->
    <template if:true={isQuickMergeModalOpen}>
        <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open" aria-labelledby="modal-heading-01" aria-modal="true">
            <div class="slds-modal__container" style="max-width: 90%; width: 80rem;">
                <!-- Modal Header -->
                <div class="slds-modal__header">
                    <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" 
                            title="Close" 
                            onclick={handleCloseMergeModal}>
                        <lightning-icon icon-name="utility:close" 
                                      alternative-text="close" 
                                      variant="inverse" 
                                      size="small">
                        </lightning-icon>
                        <span class="slds-assistive-text">Close</span>
                    </button>
                    <h2 id="modal-heading-01" class="slds-modal__title slds-hyphenate">
                        Merge Contact Records
                    </h2>
                    <p class="slds-m-top_x-small">
                        Select which field values to keep when merging these contacts
                    </p>
                </div>

                <!-- Modal Body -->
                <div class="slds-modal__content slds-p-around_medium">
                    <!-- Loading Spinner -->
                    <template if:true={isMergeLoading}>
                        <div class="slds-align_absolute-center slds-p-around_large">
                            <lightning-spinner alternative-text="Loading" size="medium"></lightning-spinner>
                        </div>
                    </template>

                    <!-- Field Selection Table -->
                    <template if:false={isMergeLoading}>
                        <template if:true={hasMergeFields}>
                            <!-- Contact Names Header -->
                            <div class="slds-grid slds-gutters slds-m-bottom_medium">
                                <div class="slds-col slds-size_1-of-2">
                                    <div class="slds-box slds-theme_shade">
                                        <p class="slds-text-heading_small">
                                            <lightning-icon icon-name="standard:contact" size="small"></lightning-icon>
                                            <span class="slds-m-left_x-small">
                                                Master: <strong>{masterContactName}</strong>
                                            </span>
                                        </p>
                                        <p class="slds-text-body_small slds-m-top_x-small">
                                            This record will be kept
                                        </p>
                                    </div>
                                </div>
                                <div class="slds-col slds-size_1-of-2">
                                    <div class="slds-box slds-theme_shade">
                                        <p class="slds-text-heading_small">
                                            <lightning-icon icon-name="standard:contact" size="small"></lightning-icon>
                                            <span class="slds-m-left_x-small">
                                                Target: <strong>{targetContactName}</strong>
                                            </span>
                                        </p>
                                        <p class="slds-text-body_small slds-m-top_x-small">
                                            This record will be deleted
                                        </p>
                                    </div>
                                </div>
                            </div>

                            <!-- Fields Table -->
                            <table class="slds-table slds-table_cell-buffer slds-table_bordered">
                                <thead>
                                    <tr class="slds-line-height_reset">
                                        <th scope="col" class="slds-text-title_caps" style="width: 20%;">
                                            <div class="slds-truncate" title="Field">Field</div>
                                        </th>
                                        <th scope="col" class="slds-text-title_caps" style="width: 40%;">
                                            <div class="slds-truncate" title="Master Value">
                                                Master Value (Keep)
                                            </div>
                                        </th>
                                        <th scope="col" class="slds-text-title_caps" style="width: 40%;">
                                            <div class="slds-truncate" title="Target Value">
                                                Target Value (Merge)
                                            </div>
                                        </th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <template for:each={mergeFieldList} for:item="field">
                                        <tr key={field.fieldName} class="slds-hint-parent">
                                            <!-- Field Label -->
                                            <td>
                                                <div class="slds-truncate" title={field.fieldLabel}>
                                                    <strong>{field.fieldLabel}</strong>
                                                    <template if:false={field.isUpdateable}>
                                                        <lightning-icon icon-name="utility:lock" 
                                                                      size="x-small" 
                                                                      alternative-text="Read-only field"
                                                                      title="Read-only field"
                                                                      class="slds-m-left_x-small slds-text-color_weak">
                                                        </lightning-icon>
                                                    </template>
                                                </div>
                                            </td>
                                            
                                            <!-- For updateable fields - show radio buttons -->
                                            <template if:true={field.isUpdateable}>
                                                <!-- Master Value with Radio -->
                                                <td class={field.selectedClass}>
                                                    <div class="slds-grid slds-grid_vertical-align-center">
                                                        <span class="slds-radio slds-m-right_x-small">
                                                            <input type="radio" 
                                                                id={field.masterRadioId}
                                                                name={field.fieldName}
                                                                value="master"
                                                                checked={field.isMasterSelected}
                                                                data-fieldname={field.fieldName}
                                                                onchange={handleFieldSelectionChange} />
                                                            <label class="slds-radio__label" for={field.masterRadioId}>
                                                                <span class="slds-radio_faux"></span>
                                                            </label>
                                                        </span>
                                                        <div class="slds-truncate" title={field.masterValue}>
                                                            {field.masterValue}
                                                        </div>
                                                    </div>
                                                </td>
                                                
                                                <!-- Target Value with Radio -->
                                                <td class={field.targetSelectedClass}>
                                                    <div class="slds-grid slds-grid_vertical-align-center">
                                                        <span class="slds-radio slds-m-right_x-small">
                                                            <input type="radio" 
                                                                id={field.targetRadioId}
                                                                name={field.fieldName}
                                                                value="target"
                                                                checked={field.isTargetSelected}
                                                                data-fieldname={field.fieldName}
                                                                onchange={handleFieldSelectionChange} />
                                                            <label class="slds-radio__label" for={field.targetRadioId}>
                                                                <span class="slds-radio_faux"></span>
                                                            </label>
                                                        </span>
                                                        <div class="slds-truncate" title={field.targetValue}>
                                                            {field.targetValue}
                                                        </div>
                                                    </div>
                                                </td>
                                            </template>
                                            
                                            <!-- For non-updateable fields - just show values without radio buttons -->
                                            <template if:false={field.isUpdateable}>
                                                <!-- Master Value (read-only) -->
                                                <td class="slds-text-color_weak">
                                                    <div class="slds-truncate" title={field.masterValue}>
                                                        {field.masterValue}
                                                    </div>
                                                </td>
                                                
                                                <!-- Target Value (read-only) -->
                                                <td class="slds-text-color_weak">
                                                    <div class="slds-truncate" title={field.targetValue}>
                                                        {field.targetValue}
                                                    </div>
                                                </td>
                                            </template>
                                        </tr>
                                    </template>
                                </tbody>
                            </table>

                            <!-- Instructions -->
                            <div class="slds-m-top_medium">
                                <div class="slds-scoped-notification slds-media slds-media_center slds-theme_info">
                                    <div class="slds-media__figure">
                                        <lightning-icon icon-name="utility:info" size="small"></lightning-icon>
                                    </div>
                                    <div class="slds-media__body">
                                        <p>
                                            <strong>Note:</strong> Fields marked with as &quot;locked&quot; are read-only and cannot be modified during merge.
                                            Fields not shown here will use standard Salesforce merge rules (master record values are kept unless blank).
                                        </p>
                                    </div>
                                </div>
                            </div>
                        </template>

                        <!-- No Fields Message -->
                        <template if:false={hasMergeFields}>
                            <div class="slds-align_absolute-center slds-p-around_large">
                                <div class="slds-text-align_center">
                                    <lightning-icon icon-name="utility:warning" size="large" variant="warning"></lightning-icon>
                                    <p class="slds-text-heading_small slds-m-top_medium">No Fields to Merge</p>
                                    <p class="slds-text-body_regular slds-m-top_small">
                                        The field set "{fieldSetName}" is empty or not configured.
                                    </p>
                                </div>
                            </div>
                        </template>
                    </template>
                </div>

                <!-- Modal Footer -->
                <div class="slds-modal__footer">
                    <button class="slds-button slds-button_neutral" 
                            onclick={handleCloseMergeModal}
                            disabled={isMergeLoading}>
                        Cancel
                    </button>
                    <button class="slds-button slds-button_brand" 
                            onclick={handleExecuteMerge}
                            disabled={mergeButtonDisabled}>
                        <template if:true={isMergeLoading}>
                            <lightning-spinner alternative-text="Loading" size="x-small" variant="inverse"></lightning-spinner>
                            <span class="slds-m-left_x-small">Merging...</span>
                        </template>
                        <template if:false={isMergeLoading}>
                            Merge Contacts
                        </template>
                    </button>
                </div>
            </div>
        </section>
        
        <!-- Modal Backdrop -->
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
</template>
